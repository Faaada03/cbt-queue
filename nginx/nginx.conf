worker_processes auto;
worker_rlimit_nofile 16384;

events {
    worker_connections 8192;
    multi_accept on;
}

http {
    upstream cbt_api {
        least_conn;
        keepalive 64;
        server api1:8000 max_fails=3 fail_timeout=10s;
        server api2:8000 max_fails=3 fail_timeout=10s;
        server api3:8000 max_fails=3 fail_timeout=10s;
    }

    server {
        listen 80 backlog=8192;
        location / {
            proxy_pass http://cbt_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
            proxy_next_upstream error timeout non_idempotent http_502 http_503;
            proxy_next_upstream_tries 2;
            add_header X-Upstream-Server $upstream_addr always;
        }
    }
}