worker_processes auto;

events {
    worker_connections 4096;
}

http {
    upstream cbt_api_cluster {
        # Tidak akan pindah sendiri saat 1000 VU, hanya pindah jika container benar-benar mati
        server fastapi_primary:8000 max_fails=30 fail_timeout=10s;
        
        # Container Cadangan (Hanya aktif saat Primary di-kill)
        server fastapi_backup:8000 backup;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://cbt_api_cluster;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;

            proxy_connect_timeout 3s;
            proxy_send_timeout 15s;
            proxy_read_timeout 15s;
            
            proxy_next_upstream error timeout http_500 http_502 http_503 http_504;
            proxy_next_upstream_tries 2;

            add_header X-Upstream-Server $upstream_addr always;
        }
    }
}   