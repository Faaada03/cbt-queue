name: cbt-queue

x-limits: &limits
  deploy:
    resources:
      limits:
        cpus: '0.25'
        memory: 256M

x-infra-limits: &infra_limits
  deploy:
    resources:
      limits:
        cpus: '0.25'
        memory: 512M

x-api-common: &api_common
  build: ./api
  environment: &api_env
    CELERY_BROKER_URL: amqp://${RMQ_USER}:${RMQ_PASS}@rmq1:5672//;amqp://${RMQ_USER}:${RMQ_PASS}@rmq2:5672//;amqp://${RMQ_USER}:${RMQ_PASS}@rmq3:5672//
    PG_HOST: pgbouncer
    PG_PORT: "5432"
    PG_PASSWORD: ${PG_PASSWORD}
    JWT_SECRET: ${JWT_SECRET}
    DEMO_PASSWORD: ${DEMO_PASSWORD}
  depends_on:
    pgbouncer:
      condition: service_started
    rmq1:
      condition: service_healthy
  networks:
    - backend-net
  restart: unless-stopped
  <<: *limits

services:
  # --- LAYER 1: DUAL NGINX GATEWAY ---
  gateway1:
    image: nginx:alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8000:80"
    depends_on:
      - api1
      - api2
      - api3
    networks:
      - frontend-net
      - backend-net
    restart: unless-stopped
    <<: *limits

  gateway2:
    image: nginx:alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8001:80"
    depends_on:
      - api1
      - api2
      - api3
    networks:
      - frontend-net
      - backend-net
    restart: unless-stopped
    <<: *limits

  # --- LAYER 2: FASTAPI POOL ACTIVE-ACTIVE (3 NODE) ---
  api1:
    <<: *api_common
    environment:
      <<: *api_env
      NODE_NAME: api-1

  api2:
    <<: *api_common
    environment:
      <<: *api_env
      NODE_NAME: api-2

  api3:
    <<: *api_common
    environment:
      <<: *api_env
      NODE_NAME: api-3

  # --- LAYER 3: PGBOUNCER & POSTGRESQL (MAX 100 CONNECTIONS) ---
  postgres:
    image: postgres:16-alpine
    command: postgres -c max_connections=100
    environment:
      POSTGRES_USER: cbt
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      POSTGRES_DB: cbt
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cbt"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - backend-net
    restart: unless-stopped
    <<: *infra_limits

  pgbouncer:
    image: edoburu/pgbouncer:latest
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: cbt
      DB_PASSWORD: ${PG_PASSWORD}
      DB_NAME: cbt
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 5000
      DEFAULT_POOL_SIZE: 80
      AUTH_TYPE: scram-sha-256
      ADMIN_USERS: cbt
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend-net
    restart: unless-stopped
    <<: *limits

  # --- LAYER 4: RABBITMQ 3-NODE CLUSTER (QUORUM QUEUE) ---
  rmq1:
    image: rabbitmq:3.13-management-alpine
    hostname: rmq1
    environment:
      RABBITMQ_ERLANG_COOKIE: ${RABBITMQ_COOKIE}
      RABBITMQ_DEFAULT_USER: ${RMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RMQ_PASS}
    volumes:
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - rmq1data:/var/lib/rabbitmq
    ports:
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 20s
      retries: 10
      start_period: 60s
    networks:
      - backend-net
      - frontend-net
    restart: always
    <<: *infra_limits

  rmq2:
    image: rabbitmq:3.13-management-alpine
    hostname: rmq2
    environment:
      RABBITMQ_ERLANG_COOKIE: ${RABBITMQ_COOKIE}
      RABBITMQ_DEFAULT_USER: ${RMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RMQ_PASS}
    volumes:
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - rmq2data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 20s
      retries: 10
      start_period: 60s
    networks:
      - backend-net
    restart: always
    <<: *infra_limits

  rmq3:
    image: rabbitmq:3.13-management-alpine
    hostname: rmq3
    environment:
      RABBITMQ_ERLANG_COOKIE: ${RABBITMQ_COOKIE}
      RABBITMQ_DEFAULT_USER: ${RMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RMQ_PASS}
    volumes:
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - rmq3data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 20s
      retries: 10
      start_period: 60s
    networks:
      - backend-net
    restart: always
    <<: *infra_limits

  # --- LAYER 5: CELERY WORKER POOL (SCALE 2 S/D 6) ---
  celery_worker:
    build: ./worker
    command: celery -A tasks worker --loglevel=info --concurrency=1
    environment:
      CELERY_BROKER_URL: amqp://${RMQ_USER}:${RMQ_PASS}@rmq1:5672//;amqp://${RMQ_USER}:${RMQ_PASS}@rmq2:5672//;amqp://${RMQ_USER}:${RMQ_PASS}@rmq3:5672//
      PG_HOST: pgbouncer
      PG_PORT: "5432"
      PG_PASSWORD: ${PG_PASSWORD}
    depends_on:
      pgbouncer:
        condition: service_started
      rmq1:
        condition: service_healthy
    networks:
      - backend-net
    restart: unless-stopped
    <<: *limits

  # --- LAYER 6: MONITORING ---
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    ports:
      - "8080:8080"
    networks:
      - backend-net
      - frontend-net
    restart: unless-stopped
    <<: *limits

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    networks:
      - backend-net
      - frontend-net
    restart: unless-stopped
    <<: *limits

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    networks:
      - backend-net
      - frontend-net
    restart: unless-stopped
    <<: *limits

networks:
  frontend-net:
    driver: bridge
  backend-net:
    driver: bridge
    internal: true

volumes:
  pgdata:
  rmq1data:
  rmq2data:
  rmq3data: