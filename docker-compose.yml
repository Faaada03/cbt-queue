name: cbt-queue

services:
  api:
    build: ./api
    ports:
      - "8000:8000"
    environment:
      CELERY_BROKER_URL: amqp://${RABBIT_USER}:${RABBIT_PASS}@rabbitmq:5672//
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - frontend-net
      - backend-net
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3.13-management
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBIT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBIT_PASS}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 6
    networks:
      - backend-net
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
    restart: unless-stopped

  worker:
    build: ./worker
    command: celery -A tasks worker --loglevel=info --concurrency=1
    environment:
      CELERY_BROKER_URL: amqp://${RABBIT_USER}:${RABBIT_PASS}@rabbitmq:5672//
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - backend-net
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: "0.25"
          memory: 256M
    restart: unless-stopped

networks:
  frontend-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24
  backend-net:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.21.0.0/24

volumes:
  rabbitmq-data:
