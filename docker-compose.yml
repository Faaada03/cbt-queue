services:
  # 1. NGINX GATEWAY (Pintu masuk port 8000 & pengatur Failover otomatis)
  gateway:
    image: nginx:alpine
    container_name: cbt_gateway
    ports:
      - "8000:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - fastapi_primary
      - fastapi_backup
    restart: always

  # 2. FASTAPI CONTAINER UTAMA (Target yang akan di-kill saat live demo)
  fastapi_primary:
    build: ./api
    container_name: cbt_fastapi_primary
    environment:
      - NODE_NAME=FASTAPI_PRIMARY (UTAMA)
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672//
      - CELERY_BROKER_URL=amqp://guest:guest@rabbitmq:5672//
    depends_on:
      rabbitmq:
        condition: service_healthy

  # 3. FASTAPI CONTAINER CADANGAN (Otomatis mengambil alih saat Primary mati)
  fastapi_backup:
    build: ./api
    container_name: cbt_fastapi_backup
    environment:
      - NODE_NAME=FASTAPI_BACKUP (CADANGAN)
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672//
      - CELERY_BROKER_URL=amqp://guest:guest@rabbitmq:5672//
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: always

  # 4. RABBITMQ MESSAGE BROKER
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: cbt_rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always

  # 5. PYTHON CELERY WORKER (Menggunakan Dockerfile di dalam folder ./worker)
  celery_worker:
    build: ./worker
    environment:
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672//
      - CELERY_BROKER_URL=amqp://guest:guest@rabbitmq:5672//
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: always